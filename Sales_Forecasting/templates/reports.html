{% extends "base.html" %}

{% block title %}
Reports
{% endblock %}

{% block page_title %}
Business Reports
{% endblock %}

{% block content %}

<div class="table-card">

    <h2>Business Summary Report</h2>

    <table class="table table-dark table-striped table-hover align-middle">

        <thead>

            <tr>

                <th>Metric</th>
                <th>Value</th>

            </tr>

        </thead>

        <tbody>

        {% for key, value in report.items() %}

            <tr>

                <td>{{ key }}</td>

                <td>{{ value }}</td>

            </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
